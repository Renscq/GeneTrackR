# Build the GeneTrackR pkgdown website and deploy it when GitHub Pages is enabled.

name: pkgdown

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pkgdown-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build pkgdown site
    runs-on: ubuntu-latest
    outputs:
      pages-ready: ${{ steps.pages-status.outputs.ready }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install website dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
          needs: website

      - name: Render README
        run: |
          Rscript tools/render_readme.R

      - name: Check pkgdown configuration
        run: |
          pkgdown::check_pkgdown()
          pkgdown::pkgdown_sitrep()
        shell: Rscript {0}

      - name: Build GitHub Pages site
        run: |
          pkgdown::build_site_github_pages(
            dest_dir = "pkgdown-site",
            new_process = FALSE,
            install = FALSE
          )
        shell: Rscript {0}

      # Avoid calling configure-pages for repositories where Pages has never
      # been initialized. The action itself emits an Error annotation on a 404
      # even when continue-on-error is set, so probe the REST endpoint first.
      - name: Detect GitHub Pages
        id: pages-probe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          http_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          )"

          case "$http_code" in
            200)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "ready=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected GitHub Pages API response: HTTP ${http_code}" >&2
              cat "$response_file" >&2
              exit 1
              ;;
          esac

      - name: Configure GitHub Pages
        if: steps.pages-probe.outputs.ready == 'true'
        id: pages
        uses: actions/configure-pages@v6

      - name: Record Pages availability
        id: pages-status
        shell: bash
        run: |
          if [[ "${{ steps.pages-probe.outputs.ready }}" == "true" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GitHub Pages deployment skipped"
              echo
              echo "The pkgdown site was built successfully, but GitHub Pages is not enabled for this repository."
              echo "The generated site is available below as the **pkgdown-site-preview** artifact."
              echo
              echo "Once Pages is enabled with **Settings → Pages → Source: GitHub Actions**, this workflow will deploy automatically on the next run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload GitHub Pages artifact
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pkgdown-site

      - name: Upload pkgdown preview artifact
        if: steps.pages-status.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site-preview
          path: pkgdown-site
          if-no-files-found: error

  deploy:
    name: Deploy GitHub Pages
    if: needs.build.outputs.pages-ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
