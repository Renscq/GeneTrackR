name: Tests-only coverage

"on":
  push:
    branches: [devel, development]
  pull_request:
    branches: [devel, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:devel
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: coverage
      - name: Measure all runtime R code with package tests
        run: >-
          Rscript tools/check_coverage.R --output-dir temp/coverage
          --minimum 80 --baseline tools/coverage/0.99.5-files.csv
      - name: Retain full coverage and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-only-coverage
          path: temp/coverage
          if-no-files-found: error
