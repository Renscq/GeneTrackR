url: https://renscq.github.io/GeneTrackR/
destination: pkgdown-site

home:
  sidebar:
    html: pkgdown/sidebar.html

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get Started
      href: articles/getting-started.html

articles:
  - title: Six workflows
    desc: >
      Start with the data model, then choose a numbered workflow. The complete
      example connects the preceding modules; export retains results and provenance.
    contents:
      - getting-started
      - annotation
      - haplotype
      - phenotype
      - complete-workflow
      - export-results

redirects:
  - ["articles/example-data.html", "articles/getting-started.html#demo-data"]
  - ["articles/core-workflows.html", "articles/complete-workflow.html"]
  - ["articles/gene-model.html", "articles/annotation.html#gene-models"]
  - ["articles/signal-tracks.html", "articles/annotation.html#signal-tracks"]
  - ["articles/variant-tracks.html", "articles/haplotype.html#variants"]
  - ["articles/linkage-disequilibrium.html", "articles/haplotype.html#ld"]
  - ["articles/browser-tracks.html", "articles/complete-workflow.html#integrated-browser"]
  - ["articles/haplotype-refinement.html", "articles/phenotype.html#refinement"]
  - ["articles/variant-effect.html", "articles/phenotype.html#variant-effects"]

reference:
  - title: Core objects
    desc: >
      Core GeneTrackR data structures and package-level documentation.
      Use Feature() to construct interval annotations; readers construct the
      corresponding objects from supported files.
    contents:
      - GeneTrackR-package
      - GenePred
      - Feature
      - BwgTrack
      - VariantTrack
      - LDTrack

  - title: Bioconductor interoperability
    desc: >
      Bring existing GRanges into the Feature interval workflow with as_feature(),
      and return feature-level metadata to Bioconductor with as_granges().
      Signal and variant tracks retain their existing GRanges export paths.
    contents:
      - as_feature
      - as_granges

  - title: Annotation I/O
    desc: >
      Read and write GenePred, GTF, GFF3, BED, and standardized feature tracks.
    contents:
      - read_genepred
      - read_gtf
      - read_gff
      - read_bed
      - write_genepred
      - write_feature
      - write_feature_track

  - title: Annotation conversion & retrieval
    desc: >
      Convert, query, merge, validate, summarize, and inspect annotation objects.
    contents:
      - as_genepred
      - as_gene_table
      - as_transcript_table
      - as_exon_table
      - as_feature_table
      - retrieve_feature
      - merge_feature
      - validate_feature
      - summary_feature
      - get_gene_length_distribution_table

  - title: Gene model visualization
    desc: >
      Visualize genes, transcripts, genomic regions, interval features, and
      annotation length distributions.
    contents:
      - plot_gene
      - plot_transcript
      - plot_region
      - plot_feature_track
      - plot_gene_length_distribution

  - title: Signal tracks
    desc: >
      Read, transform, query, write, summarize, and visualize bedGraph, wig,
      and bigWig genomic signals through the built-in pure-R I/O layer.
    contents:
      - read_bwg
      - write_bwg
      - retrieve_bwg
      - slice_bwg
      - merge_bwg
      - norm_bwg
      - bin_bwg
      - seqinfo_bwg
      - validate_bwg
      - summary_bwg
      - head.BwgTrack
      - plot_signal_gene
      - plot_signal_transcript
      - plot_signal_region
      - plot_tracks

  - title: Variant tracks
    desc: >
      Use read_vcf() to read variants, then query, validate, summarize, write,
      and visualize the resulting tracks.
    contents:
      - read_vcf
      - as_variant_track
      - write_vcf
      - write_variant_track
      - retrieve_vcf
      - validate_vcf
      - summary_vcf
      - plot_variant
      - plot_variant_track

  - title: Haplotype analysis
    desc: >
      Construct haplotypes from genes, transcripts, or genomic regions and
      visualize haplotype-defining variants.
    contents:
      - hap_variant
      - hap_gene_variant
      - hap_region_variant
      - plot_hap_variant

  - title: Phenotype association
    desc: >
      Read and summarize phenotype data and test phenotype differences across
      haplotypes or individual variant genotypes.
    contents:
      - read_pheno
      - summary_pheno
      - plot_pheno
      - plot_hap_pheno
      - plot_variant_pheno
      - print.GeneTrackRPhenoPlot

  - title: Linkage disequilibrium
    desc: >
      Compute pairwise linkage disequilibrium and visualize triangular LD maps.
    contents:
      - compute_ld_block
      - plot_ld_block

  - title: Variant effect & refinement
    desc: >
      Refine haplotypes with phenotype evidence and prioritize natural variants
      by phenotype-associated effect size.
    contents:
      - refine_haplotype
      - plot_hap_refined
      - plot_refined_hap_variant
      - plot_refined_hap_pheno
      - plot_variant_effect

  - title: Diagnostics & advanced utilities
    desc: >
      Advanced parameters and diagnostics for indexed genomic track workflows.
    contents:
      - GeneTrackR-demo-data
      - GeneTrackR-advanced-parameters
      - diagnose_tabix
      - benchmark_tabix_query

  - title: Compatibility aliases
    desc: >
      Supported aliases retained for existing code, with the same arguments
      and return objects as their recommended entry points. Prefer Feature()
      to FeatureTrack() and read_vcf() to read_vcf_track().
    contents:
      - FeatureTrack
      - read_vcf_track
